# ==========================================
# DATABASE
# ==========================================
spring.datasource.url=${DB_URL}

# ==========================================
# SPRINGDOC / SWAGGER
# ==========================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.version=5.34.1

# ==========================================
# ADMINISTRATOR BOOTSTRAP
# ==========================================
app.admin.bootstrap.required=false