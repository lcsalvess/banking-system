# ==========================================
# APPLICATION
# ==========================================

# Nome da aplicação utilizado pelo Spring Boot e pelos componentes de observabilidade.
spring.application.name=banking-system

# ==========================================
# DATABASE
# ==========================================

spring.datasource.url=${DB_URL}

# Credenciais obtidas por variáveis de ambiente.
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Tempo máximo (ms) de espera por locks de linha. O PostgreSQL espera para sempre por
# padrão, e o Hibernate não traduz timeout > 0 em FOR UPDATE. Ao estourar, o banco
# devolve 55P03, tratado como 503 pelo GlobalExceptionHandler.
spring.datasource.hikari.connection-init-sql=SET lock_timeout = 3000

# ==========================================
# FLYWAY
# ==========================================

# Usa uma conexão independente com credenciais próprias
# para executar as migrações do banco de dados.
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${DB_MIGRATOR_USERNAME}
spring.flyway.password=${DB_MIGRATOR_PASSWORD}

# db/callback contém o afterMigrate que reaplica a cada inicialização os privilégios
# do usuário de runtime (banking_app). Ele exige que o Flyway rode como banking_migrator
# e falha a inicialização caso contrário. O perfil test não carrega esse diretório.
spring.flyway.locations=classpath:db/migration,classpath:db/callback

# ==========================================
# JPA / HIBERNATE
# ==========================================

# O Hibernate valida o schema existente, mas não realiza alterações automaticamente.
spring.jpa.hibernate.ddl-auto=validate

# Desabilita a exibição de SQL no log da aplicação.
spring.jpa.show-sql=false

# Formata o SQL quando gerado internamente pelo Hibernate.
spring.jpa.properties.hibernate.format_sql=true

# Evita manter o EntityManager aberto durante toda a requisição HTTP.
spring.jpa.open-in-view=false

# ==========================================
# JWT
# ==========================================

# Chave utilizada para assinar e validar os tokens JWT.
# Deve ser fornecida por variável de ambiente.
jwt.secret=${JWT_SECRET}

# Tempo de validade do token em segundos.
jwt.expiration=3600

# Identifica a aplicação responsável pela emissão dos tokens.
jwt.issuer=banking-system

# ==========================================
# LOGIN RATE LIMITING
# ==========================================

# Bucket4j: limite de requisições de login por endereço IP.
banking.security.login.ip-capacity=20
banking.security.login.ip-refill-period=1m

# Tentativas por combinação de usuário e IP dentro da janela. Atingido o limite, essa
# combinação fica bloqueada. Como a chave inclui o IP, quem erra a senha de um usuário
# bloqueia apenas o próprio IP, e não o usuário legítimo.
banking.security.login.max-failed-attempts=5

# Tentativas por usuário somando todos os IPs. Contém ataques distribuídos contra uma
# mesma conta; deve ser maior ou igual ao limite por usuário e IP. Atingido o limite, o
# usuário fica bloqueado em qualquer IP.
banking.security.login.max-failed-attempts-per-username=50

# Janela em que as tentativas são somadas e duração do bloqueio.
banking.security.login.failure-window=15m
banking.security.login.lock-duration=15m

# Limita o crescimento dos caches em memória. Com o cache cheio, entradas podem ser
# descartadas, o que encerra um bloqueio antes do prazo.
banking.security.login.maximum-tracked-keys=100000

# ==========================================
# IP DO CLIENTE / PROXY REVERSO
# ==========================================

# O limitador usa request.getRemoteAddr(). Por padrão, é o endereço da conexão TCP.
# Atrás de um proxy reverso ou load balancer, todos os clientes aparecem com o IP do
# proxy e passam a dividir o mesmo limite de IP. Para usar o IP original, informe:
#   PROXY_IP_HEADER cabeçalho com o IP do cliente (ex.: X-Forwarded-For)
#   TRUSTED_PROXIES regex (java.util.regex) dos IPs dos proxies confiáveis
# O cabeçalho só é considerado quando a requisição vem de um proxy confiável. Sem
# TRUSTED_PROXIES, nenhum proxy é confiável e o cabeçalho é ignorado. Nunca confie no
# cabeçalho sem restringir os proxies, ou qualquer cliente poderá forjar o próprio IP.
server.forward-headers-strategy=none
server.tomcat.remoteip.remote-ip-header=${PROXY_IP_HEADER:}
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXIES:}

# ==========================================
# TASK EXECUTION
# ==========================================

# O applicationTaskExecutor é construído pelo ThreadPoolTaskExecutorBuilder do Spring Boot,
# então o dimensionamento e o shutdown são configurados aqui.
spring.task.execution.pool.core-size=8
spring.task.execution.pool.allow-core-thread-timeout=true
spring.task.execution.thread-name-prefix=task-

# Aguarda as tarefas em andamento ao encerrar a aplicação.
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=30s

# ==========================================
# DAILY YIELD
# ==========================================

# Expressão cron (Spring, 6 campos) do job de rendimento diário da poupança.
# O fuso horário é fixo em America/Sao_Paulo (AppTimeZone).
banking.yield.cron=0 5 0 * * *

# ==========================================
# BALANCE RECONCILIATION
# ==========================================

# Expressão cron (Spring, 6 campos) da conferência entre o saldo das contas e o
# balance_after da última transação de cada uma. Só detecta e registra em log.
# O fuso horário é fixo em America/Sao_Paulo (AppTimeZone).
banking.reconciliation.cron=0 0 3 * * *

# ==========================================
# TRANSACTION IDEMPOTENCY
# ==========================================

# Expressão cron (Spring, 6 campos) da limpeza dos registros de idempotência antigos.
# O fuso horário é fixo em America/Sao_Paulo.
banking.idempotency.cleanup-cron=0 30 3 * * *

# Dias de retenção das chaves de idempotência. Depois desse prazo, repetir a mesma
# Idempotency-Key executa a operação novamente, então o valor deve ser maior que a
# janela de retry dos clientes.
banking.idempotency.retention-days=7

# ==========================================
# ADMIN BOOTSTRAP
# ==========================================
# Credenciais opcionais utilizadas para criação do usuário administrador inicial.
app.admin.username=${ADMIN_USERNAME:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.bootstrap.required=true

# ==========================================
# EXTERNAL INTEGRATIONS
# ==========================================

# Provedores utilizados para consulta de endereço por CEP.
integration.address.viacep.base-url=https://viacep.com.br
integration.address.brasilapi.base-url=https://brasilapi.com.br

# ==========================================
# LOGGING
# ==========================================

# Nível padrão de log para os componentes da aplicação.
logging.level.com.lcsalvess.bankingsystem=INFO

# ==========================================
# SPRINGDOC / SWAGGER
# ==========================================

# Desabilita a documentação OpenAPI e a interface Swagger UI.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Evita adicionar automaticamente respostas genéricas do ControllerAdvice.
springdoc.override-with-generic-response=false

# Configura a organização e a apresentação do Swagger UI.
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true

# ==========================================
# PAGINATION
# ==========================================

# Número máximo de registros permitido por página para evitar consultas excessivamente grandes.
spring.data.web.pageable.max-page-size=100

# ==========================================
# ACTUATOR
# ==========================================

# Expõe somente os endpoints de gerenciamento necessários via HTTP.
management.endpoints.web.exposure.include=health,info,metrics

# Habilita explicitamente os endpoints de liveness e readiness.
management.endpoint.health.probes.enabled=true

# Exibe detalhes do health check somente para requisições autorizadas.
management.endpoint.health.show-details=when_authorized

# Habilita informações provenientes do ambiente no endpoint /actuator/info.
management.info.env.enabled=true

# ==========================================
# APPLICATION INFO
# ==========================================

info.app.name=Banking System
info.app.description=REST API for banking operations
info.app.version=@project.version@