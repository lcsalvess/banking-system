name: OWASP Dependency-Check

on:
  push:
    branches: [ master ]
    paths:
      - pom.xml
      - .mvn/**
      - mvnw
      - mvnw.cmd
      - dependency-check-suppressions.xml
      - .github/workflows/dependency-check.yml

  pull_request:
    branches: [ master ]
    paths:
      - pom.xml
      - .mvn/**
      - mvnw
      - mvnw.cmd
      - dependency-check-suppressions.xml
      - .github/workflows/dependency-check.yml

  schedule:
    - cron: '17 6 */3 * *'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-check-pr:
    name: Dependency vulnerability scan (pull request)
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Get UTC date for cache key
        id: cache-date
        run: echo "date=$(date -u +'%Y%m%d')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Restore Dependency-Check database cache
        id: odc-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.dependency-check-data
          key: ${{ runner.os }}-odc-13.0.0-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-odc-13.0.0-
          fail-on-cache-miss: true

      - name: Validate Dependency-Check cache freshness
        env:
          RESTORED_CACHE_KEY: ${{ steps.odc-cache-restore.outputs.cache-matched-key }}
          MAX_CACHE_AGE_DAYS: '8'
        shell: bash
        run: |
          set -euo pipefail

          expected_prefix="${RUNNER_OS}-odc-13.0.0-"

          if [[ -z "$RESTORED_CACHE_KEY" ]]; then
            echo "::error::Dependency-Check cache restore did not provide a matched cache key."
            exit 1
          fi

          case "$RESTORED_CACHE_KEY" in
            "$expected_prefix"*) ;;
            *)
              echo "::error::Unexpected Dependency-Check cache key format: '$RESTORED_CACHE_KEY'."
              exit 1
              ;;
          esac

          cache_date="${RESTORED_CACHE_KEY#"$expected_prefix"}"

          if [[ ! "$cache_date" =~ ^[0-9]{8}$ ]]; then
            echo "::error::Dependency-Check cache key does not contain a valid YYYYMMDD date: '$RESTORED_CACHE_KEY'."
            exit 1
          fi

          cache_date_iso="${cache_date:0:4}-${cache_date:4:2}-${cache_date:6:2}"

          if ! cache_epoch="$(date -u -d "$cache_date_iso" +%s 2>/dev/null)"; then
            echo "::error::Unable to parse the date from the restored Dependency-Check cache key: '$RESTORED_CACHE_KEY'."
            exit 1
          fi

          if [[ "$(date -u -d "@$cache_epoch" +%Y%m%d)" != "$cache_date" ]]; then
            echo "::error::The restored Dependency-Check cache key contains an invalid calendar date: '$RESTORED_CACHE_KEY'."
            exit 1
          fi

          today_iso="$(date -u +'%Y-%m-%d')"
          today_epoch="$(date -u -d "$today_iso" +%s)"
          age_days=$(( (today_epoch - cache_epoch) / 86400 ))

          if (( age_days < 0 )); then
            echo "::error::The restored Dependency-Check cache is dated in the future: '$RESTORED_CACHE_KEY'."
            exit 1
          fi

          if (( age_days > MAX_CACHE_AGE_DAYS )); then
            echo "::error::The restored Dependency-Check cache is too old (${age_days} days). Maximum allowed age: ${MAX_CACHE_AGE_DAYS} days. Restored key: '$RESTORED_CACHE_KEY'."
            exit 1
          fi

          echo "Dependency-Check cache is fresh: key='$RESTORED_CACHE_KEY', age=${age_days} days, maximum=${MAX_CACHE_AGE_DAYS} days."

      - name: Scan dependencies using cached vulnerability data
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          -DautoUpdate=false
          -DossIndexAnalyzerEnabled=false
          org.owasp:dependency-check-maven:13.0.0:check

      - name: Upload Dependency-Check reports
        if: always() && hashFiles('target/dependency-check-report.html', 'target/dependency-check-report.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: warn
          retention-days: 14

  dependency-check:
    name: Dependency vulnerability scan (trusted)
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    environment:
      name: dependency-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: sonatype-guide
          server-username-env-var: GITHUB_ACTOR
          server-password-env-var: SONATYPE_GUIDE_PAT

      - name: Get UTC date for cache key
        id: cache-date
        run: echo "date=$(date -u +'%Y%m%d')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Restore Dependency-Check database cache
        id: odc-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.dependency-check-data
          key: ${{ runner.os }}-odc-13.0.0-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-odc-13.0.0-

      - name: Scan dependencies
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          org.owasp:dependency-check-maven:13.0.0:check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          SONATYPE_GUIDE_PAT: ${{ secrets.SONATYPE_GUIDE_PAT }}

      - name: Save updated Dependency-Check database
        if: success() && steps.odc-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.dependency-check-data
          key: ${{ steps.odc-cache-restore.outputs.cache-primary-key }}

      - name: Upload Dependency-Check reports
        if: always() && hashFiles('target/dependency-check-report.html', 'target/dependency-check-report.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: warn
          retention-days: 14
