# ==========================================
# APPLICATION
# ==========================================

# Application name used by Spring Boot and observability components.
spring.application.name=banking-system

# ==========================================
# DATABASE
# ==========================================

# Maximum time (in milliseconds) to wait for row-level locks.
# PostgreSQL waits indefinitely by default. Hibernate does not translate
# a positive lock timeout into a PostgreSQL lock_timeout setting for
# FOR UPDATE statements. When the timeout is exceeded, PostgreSQL returns
# SQLSTATE 55P03, which is handled as a 503 response by the GlobalExceptionHandler.
spring.datasource.hikari.connection-init-sql=SET lock_timeout = 3000

# ==========================================
# FLYWAY
# ==========================================

# Uses a separate database connection with dedicated credentials
# to execute database migrations.
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${DB_MIGRATOR_USERNAME}
spring.flyway.password=${DB_MIGRATOR_PASSWORD}

# db/callback contains the afterMigrate callback, which reapplies the runtime
# user's (banking_app) privileges after migrations. It requires Flyway to run
# as banking_migrator and fails application startup otherwise.
# The test profile does not load this directory.
spring.flyway.locations=classpath:db/migration,classpath:db/callback

# ==========================================
# JPA / HIBERNATE
# ==========================================

# Hibernate validates the existing schema but does not modify it automatically.
spring.jpa.hibernate.ddl-auto=validate

# Disables SQL statement output in the application logs.
spring.jpa.show-sql=false

# Formats SQL statements generated internally by Hibernate.
spring.jpa.properties.hibernate.format_sql=true

# Prevents the EntityManager from remaining open throughout the entire HTTP request.
spring.jpa.open-in-view=false

# Batch inserts used when materializing audit query snapshots.
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

# ==========================================
# TASK EXECUTION
# ==========================================

# The applicationTaskExecutor is built using Spring Boot's
# ThreadPoolTaskExecutorBuilder, so its pool size and shutdown behavior
# are configured through these properties.
spring.task.execution.pool.core-size=8
spring.task.execution.pool.allow-core-thread-timeout=true
spring.task.execution.thread-name-prefix=task-

# Waits for ongoing tasks to complete when the application shuts down.
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=30s

# ==========================================
# JWT
# ==========================================

# Secret key used to sign and validate JWTs.
# Must be provided through an environment variable.
jwt.secret=${JWT_SECRET}

# Token validity period in seconds.
jwt.expiration=3600

# Identifies the application responsible for issuing the tokens.
jwt.issuer=banking-system

# ==========================================
# REVERSE PROXY / CLIENT IP
# ==========================================

# The rate limiter uses request.getRemoteAddr(), which returns the remote
# address of the TCP connection by default.
#
# When running behind a reverse proxy or load balancer, all clients may
# appear to originate from the proxy IP address and share the same IP-based limit.
#
# To use the original client IP address, configure:
#   PROXY_IP_HEADER: Header containing the client IP (e.g., X-Forwarded-For).
#   TRUSTED_PROXIES: Regular expression (java.util.regex) matching trusted proxy IPs.
#
# The header is only considered when the request originates from a trusted proxy.
# Without TRUSTED_PROXIES, no proxy is trusted and the header is ignored.
# Never trust forwarded headers without restricting trusted proxies,
# as any client could otherwise spoof their own IP address.
server.forward-headers-strategy=none
server.tomcat.remoteip.remote-ip-header=${PROXY_IP_HEADER:}
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXIES:}

# ==========================================
# LOGIN RATE LIMITING
# ==========================================

# Bucket4j: maximum number of login requests per IP address.
banking.security.login.ip-capacity=20
banking.security.login.ip-refill-period=1m

# Maximum number of failed attempts for a username and IP address combination
# within the configured time window. Once the limit is reached, that combination
# is blocked. Since the key includes the IP address, an attacker can only block
# their own IP address, not the legitimate user's access.
banking.security.login.max-failed-attempts=5

# Maximum number of failed attempts for a username across all IP addresses.
# This helps mitigate distributed attacks against a single account.
# This value must be greater than or equal to the per-username-and-IP limit.
# Once reached, the username is blocked regardless of the IP address used.
banking.security.login.max-failed-attempts-per-username=50

# Time window used to count failed attempts and the duration of the lockout.
banking.security.login.failure-window=15m
banking.security.login.lock-duration=15m

# Limits the growth of in-memory caches. When the cache reaches its capacity,
# entries may be evicted, potentially ending a lockout before its expiration.
banking.security.login.maximum-tracked-keys=100000

# ==========================================
# ADMINISTRATOR BOOTSTRAP
# ==========================================

# Initial administrator account settings.
# All four values are required when no administrator exists
# and the bootstrap process is configured as mandatory.
app.admin.full-name=${ADMIN_FULL_NAME:}
app.admin.username=${ADMIN_USERNAME:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.bootstrap.required=true

# ==========================================
# EXTERNAL INTEGRATIONS
# ==========================================

# Providers used for ZIP code-based address lookups.
integration.address.viacep.base-url=https://viacep.com.br
integration.address.brasilapi.base-url=https://brasilapi.com.br

# ==========================================
# SCHEDULED TASKS
# ==========================================

# ------------------------------------------
# AUDIT QUERY SNAPSHOT CLEANUP
# ------------------------------------------

# Spring cron expression (6 fields) for cleaning up expired audit query snapshots.
# The cleanup job runs every 5 minutes.
# The time zone is fixed to America/Sao_Paulo.
banking.audit.snapshot.cleanup-cron=0 */5 * * * *

# ------------------------------------------
# DAILY YIELD
# ------------------------------------------

# Spring cron expression (6 fields) for the daily savings account yield job.
# The time zone is fixed to America/Sao_Paulo (AppTimeZone).
banking.yield.cron=0 5 0 * * *

# ------------------------------------------
# BALANCE RECONCILIATION
# ------------------------------------------

# Spring cron expression (6 fields) for checking the consistency between
# account balances and the balance_after value of each account's latest transaction.
# It only detects inconsistencies and records them in the application logs.
# The time zone is fixed to America/Sao_Paulo (AppTimeZone).
banking.reconciliation.cron=0 0 3 * * *

# ------------------------------------------
# TRANSACTION IDEMPOTENCY CLEANUP
# ------------------------------------------

# Spring cron expression (6 fields) for cleaning up expired idempotency records.
# The time zone is fixed to America/Sao_Paulo.
banking.idempotency.cleanup-cron=0 30 3 * * *

# Retention period for idempotency keys, in days. After this period, reusing
# the same Idempotency-Key will execute the operation again. Therefore, this
# value must exceed the clients' retry window.
banking.idempotency.retention-days=7

# ==========================================
# PAGINATION
# ==========================================

# Maximum number of records allowed per page to prevent excessively large queries.
spring.data.web.pageable.max-page-size=100

# ==========================================
# SPRINGDOC / SWAGGER
# ==========================================

# Disables OpenAPI documentation and the Swagger UI.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Prevents generic responses from the ControllerAdvice from being added automatically.
springdoc.override-with-generic-response=false

# Configures the organization and presentation of the Swagger UI.
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true

# ==========================================
# ACTUATOR
# ==========================================

# Exposes only the management endpoints required over HTTP.
management.endpoints.web.exposure.include=health,info,metrics

# Explicitly enables the liveness and readiness health endpoints.
management.endpoint.health.probes.enabled=true

# Displays health check details only to authorized requests.
management.endpoint.health.show-details=when_authorized

# Enables information from the application environment in the /actuator/info endpoint.
management.info.env.enabled=true

# ==========================================
# LOGGING
# ==========================================

# Default logging level for the application's components.
logging.level.com.lcsalvess.bankingsystem=INFO

# ==========================================
# APPLICATION INFO
# ==========================================

info.app.name=Banking System
info.app.description=REST API for banking operations
info.app.version=@project.version@
