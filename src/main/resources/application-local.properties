# ==========================================
# DATABASE
# ==========================================

# Local database connection.
# All values must be provided through environment variables.
spring.datasource.url=${DB_LOCAL_URL}
spring.datasource.username=${DB_LOCAL_USERNAME}
spring.datasource.password=${DB_LOCAL_PASSWORD}

# ==========================================
# FLYWAY
# ==========================================

# Dedicated database credentials for Flyway migrations.
spring.flyway.user=${DB_LOCAL_MIGRATOR_USERNAME}
spring.flyway.password=${DB_LOCAL_MIGRATOR_PASSWORD}

# ==========================================
# ADMINISTRATOR BOOTSTRAP
# ==========================================

# Allows application startup without an initial administrator account.
app.admin.bootstrap.required=false

# ==========================================
# SPRINGDOC / SWAGGER
# ==========================================

# Enables OpenAPI documentation endpoints.
springdoc.api-docs.enabled=true

# Enables the Swagger UI interface.
springdoc.swagger-ui.enabled=true

# Specifies the Swagger UI WebJar version used by Springdoc.
# Must match the version available on the application classpath.
springdoc.swagger-ui.version=5.34.1
