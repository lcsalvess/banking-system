
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Testes automatizados
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_DB: banking_system_test
          POSTGRES_USER: banking_test
          POSTGRES_PASSWORD: banking_test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U banking_test -d banking_system_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_PROFILES_ACTIVE: test
      DB_URL: jdbc:postgresql://localhost:5432/banking_system_test
      DB_USERNAME: banking_test
      DB_PASSWORD: banking_test_password
      JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress verify
