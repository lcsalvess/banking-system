# ==========================================
# DATABASE
# ==========================================

# Production database connection.
# All values must be provided through environment variables.
spring.datasource.url=${DB_PROD_URL}
spring.datasource.username=${DB_PROD_USERNAME}
spring.datasource.password=${DB_PROD_PASSWORD}

# ==========================================
# FLYWAY
# ==========================================

# Dedicated database credentials for Flyway migrations.
spring.flyway.user=${DB_PROD_MIGRATOR_USERNAME}
spring.flyway.password=${DB_PROD_MIGRATOR_PASSWORD}
