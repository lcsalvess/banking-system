name: OWASP Dependency-Check

on:
  push:
    branches: [ master ]
    paths:
      - pom.xml
      - .mvn/**
      - mvnw
      - mvnw.cmd
      - dependency-check-suppressions.xml
      - .github/workflows/dependency-check.yml

  pull_request:
    branches: [ master ]
    paths:
      - pom.xml
      - .mvn/**
      - mvnw
      - mvnw.cmd
      - dependency-check-suppressions.xml
      - .github/workflows/dependency-check.yml

  schedule:
    - cron: '17 6 * * 1'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-check-pr:
    name: Dependency vulnerability scan (pull request)
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Get UTC date for cache key
        id: cache-date
        run: echo "date=$(date -u +'%Y%m%d')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Restore Dependency-Check database cache
        id: odc-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.dependency-check-data
          key: ${{ runner.os }}-odc-13.0.0-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-odc-13.0.0-
          fail-on-cache-miss: true

      - name: Scan dependencies using cached vulnerability data
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          -DautoUpdate=false
          -DossIndexAnalyzerEnabled=false
          org.owasp:dependency-check-maven:13.0.0:check

      - name: Upload Dependency-Check reports
        if: always() && hashFiles('target/dependency-check-report.html', 'target/dependency-check-report.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: warn
          retention-days: 14

  dependency-check:
    name: Dependency vulnerability scan (trusted)
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    environment:
      name: dependency-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: sonatype-guide
          server-username-env-var: GITHUB_ACTOR
          server-password-env-var: SONATYPE_GUIDE_PAT

      - name: Get UTC date for cache key
        id: cache-date
        run: echo "date=$(date -u +'%Y%m%d')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Restore Dependency-Check database cache
        id: odc-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.dependency-check-data
          key: ${{ runner.os }}-odc-13.0.0-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-odc-13.0.0-

      - name: Scan dependencies
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          org.owasp:dependency-check-maven:13.0.0:check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          SONATYPE_GUIDE_PAT: ${{ secrets.SONATYPE_GUIDE_PAT }}

      - name: Save updated Dependency-Check database
        if: success() && steps.odc-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.dependency-check-data
          key: ${{ steps.odc-cache-restore.outputs.cache-primary-key }}

      - name: Upload Dependency-Check reports
        if: always() && hashFiles('target/dependency-check-report.html', 'target/dependency-check-report.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: warn
          retention-days: 14
