version: 2

updates:
  # Dependências Java e Spring gerenciadas pelo Maven
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      spring-ecosystem:
        patterns:
          - "org.springframework*"

  # Versões das actions utilizadas pelo GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:30"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"