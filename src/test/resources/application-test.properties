# ==========================================
# DATABASE
# ==========================================

# Test database connection.
# All values must be provided through environment variables.
spring.datasource.url=${DB_TEST_URL}
spring.datasource.username=${DB_TEST_USERNAME}
spring.datasource.password=${DB_TEST_PASSWORD}

# ==========================================
# FLYWAY
# ==========================================

# The test database user is responsible for both
# executing migrations and accessing the database.
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${DB_TEST_USERNAME}
spring.flyway.password=${DB_TEST_PASSWORD}

# Excludes the db/callback directory because its afterMigrate
# callback requires the dedicated banking_migrator role.
spring.flyway.locations=classpath:db/migration

# ==========================================
# ADMINISTRATOR BOOTSTRAP
# ==========================================

# Allows tests to run without an initial administrator account.
app.admin.bootstrap.required=false

# ==========================================
# AUDIT QUERY SNAPSHOT CLEANUP
# ==========================================

# Disables automatic snapshot cleanup during tests.
# Integration tests invoke the cleanup job explicitly.
banking.audit.snapshot.cleanup-cron=-
