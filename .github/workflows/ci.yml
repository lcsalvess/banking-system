name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18@sha256:b9f6b8ff03b62f3cfd9d9ba3fe56226a9991c79d3fb46fd46536263bf02be553

        env:
          POSTGRES_DB: banking_system_test
          POSTGRES_USER: banking_test
          POSTGRES_PASSWORD: banking_test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U banking_test -d banking_system_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_PROFILES_ACTIVE: test
      DB_URL: jdbc:postgresql://localhost:5432/banking_system_test
      DB_USERNAME: banking_test
      DB_PASSWORD: banking_test_password
      JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload JaCoCo coverage report
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: error
          retention-days: 14

      - name: Upload SpotBugs report
        if: always() && hashFiles('target/spotbugsXml.xml') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          if-no-files-found: error
          retention-days: 14

  least-privilege:
    name: Least-privilege database roles
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18@sha256:b9f6b8ff03b62f3cfd9d9ba3fe56226a9991c79d3fb46fd46536263bf02be553

        env:
          POSTGRES_DB: banking_privilege_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_admin_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d banking_privilege_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGPASSWORD: postgres_admin_password
      PRIVILEGE_TEST_DB_URL: jdbc:postgresql://localhost:5432/banking_privilege_test
      PRIVILEGE_TEST_MIGRATOR_USER: banking_migrator
      PRIVILEGE_TEST_MIGRATOR_PASSWORD: migrator_test_password
      PRIVILEGE_TEST_APP_USER: banking_app
      PRIVILEGE_TEST_APP_PASSWORD: app_test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Provision database roles
        run: |
          psql -h localhost -U postgres -d banking_privilege_test \
            -v ON_ERROR_STOP=1 -f scripts/db/bootstrap-roles.sql
          psql -h localhost -U postgres -d banking_privilege_test \
            -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE banking_migrator PASSWORD '${PRIVILEGE_TEST_MIGRATOR_PASSWORD}'" \
            -c "ALTER ROLE banking_app PASSWORD '${PRIVILEGE_TEST_APP_PASSWORD}'"

      - name: Run least-privilege smoke tests
        run: >-
          ./mvnw --batch-mode --no-transfer-progress test
          -Dtest=LeastPrivilegeSmokeTests
          -Dsurefire.failIfNoSpecifiedTests=false

      # Separate step, after the smoke test: that test verifies the migrations
      # from an empty database, and the end-to-end test leaves it migrated.
      - name: Run runtime privileges end-to-end tests
        run: >-
          ./mvnw --batch-mode --no-transfer-progress test
          -Dtest=RuntimePrivilegesEndToEndTests
          -Dsurefire.failIfNoSpecifiedTests=false

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and verify actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        shell: bash
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/actionlint.tar.gz"

          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"

          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" \
            | sha256sum --check

          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          chmod +x "$RUNNER_TEMP/actionlint"

      - name: Lint GitHub Actions workflows
        shell: bash
        run: |
          "$RUNNER_TEMP/actionlint" -color
