# ==========================================
# DATABASE
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/banking_system_test
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ==========================================
# FLYWAY
# ==========================================

# Nos testes, o mesmo usuário de teste executa
# as migrações e acessa o banco.
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}

# Sem o diretório db/callback: o afterMigrate de privilégios exige banking_migrator.
spring.flyway.locations=classpath:db/migration

# ==========================================
# ADMIN BOOTSTRAP
# ==========================================
app.admin.bootstrap.required=false